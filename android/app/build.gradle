plugins { id 'com.android.application' }

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.ciblix.crm'
    compileSdk 35
    defaultConfig {
        // Nouvel applicationId : évite « app non installée » face aux anciennes signatures debug/release.
        applicationId 'com.ciblix.app'
        minSdk 26
        targetSdk 34
        versionCode 22
        versionName '0.1.22'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                // Certains installateurs mobiles refusent V2 seul.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Release installable (keystore local de test) — distinct du debug ; pas la clé Play Store.
            if (keystorePropertiesFile.exists()) signingConfig signingConfigs.release
        }
        debug {
            // Même clé que release pour pouvoir mettre à jour sans désinstaller (sinon « app non installée »).
            if (keystorePropertiesFile.exists()) signingConfig signingConfigs.release
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
}
